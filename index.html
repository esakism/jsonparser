<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jsonify - Advanced JSON Parser & Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; overflow: hidden; }
    #app { width: 100vw; height: 100vh; }
    .loading-screen {
      display: flex; align-items: center; justify-content: center;
      width: 100vw; height: 100vh; background: #0f172a; color: #e2e8f0;
      font-size: 1.2rem; font-family: 'Inter', sans-serif;
    }
    .loading-screen .spinner {
      width: 40px; height: 40px; border: 3px solid #334155;
      border-top-color: #3b82f6; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-right: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading-screen">
      <div class="spinner"></div>
      <span>Loading Jsonify...</span>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
